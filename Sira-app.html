var $ = function(id){ return document.getElementById(id); };
var home = $("home"), view = $("view"), N = POOL.length, done = [], cur = null;
try { done = JSON.parse(localStorage.getItem("sira_done") || "[]"); cur = localStorage.getItem("sira_cur"); cur = cur === null ? null : +cur; } catch(e){}
function save(){ try { localStorage.setItem("sira_done", JSON.stringify(done)); localStorage.setItem("sira_cur", cur === null ? "" : cur); } catch(e){} }
function el(tag, cls, text){ var e = document.createElement(tag); if (cls) e.className = cls; if (text) e.textContent = text; return e; }
function sec(cls, title, text){ var d = el("div", cls); d.appendChild(el("b", "", title)); d.appendChild(document.createTextNode(text)); return d; }
function shuffle(a){ a = a.slice(); for (var i = a.length - 1; i > 0; i--){ var j = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function remaining(){ var r = []; for (var i = 0; i < N; i++) if (done.indexOf(i) < 0) r.push(i); return r; }
function pick(){
  var r = remaining(); if (!r.length) return null;
  if (cur !== null && done.indexOf(cur) < 0 && cur < N) return cur;
  cur = r[Math.floor(Math.random() * r.length)]; save(); return cur;
}

function renderHome(){
  var fin = !remaining().length;
  $("prog").textContent = fin ? "🎉 أنهيت جميع الأسئلة!" : (done.length ? "اجتزت " + done.length + " من " + N : "عدد الأسئلة: " + N);
  $("start").className = fin ? "next hide" : "next";
  $("start").textContent = done.length ? "تابع الاختبار" : "ابدأ الاختبار";
  $("reset").className = done.length ? "reset" : "reset hide";
  view.className = "hide"; home.className = ""; document.body.className = ""; $("deco").textContent = "";
}

function lesson(body, d, open){
  var box = el("div", open ? "" : "hide"), ti = 0, ch = el("div", "ch"), ct = el("span", "", d.tasks[0]);
  box.appendChild(sec("sec", "🌿 الموقف", d.title));
  box.appendChild(sec("sec", "🧠 التحليل النفسي", d.psy));
  box.appendChild(sec("sec", "📜 الموقف التاريخي", d.story));
  ch.appendChild(el("b", "", "🎯 التحدي العملي")); ch.appendChild(ct);
  if (d.tasks.length > 1){
    var mb = el("button", "more", "🔄 تحدٍّ آخر");
    mb.onclick = function(){ ti = (ti + 1) % d.tasks.length; ct.textContent = d.tasks[ti]; };
    ch.appendChild(el("br")); ch.appendChild(mb);
  }
  box.appendChild(ch); box.appendChild(el("div", "src", "📖 المصدر: " + d.src));
  if (!open){
    var tg = el("button", "more", "📜 اعرض الدرس");
    tg.onclick = function(){ box.className = ""; tg.className = "hide"; };
    body.appendChild(tg);
  }
  body.appendChild(box);
}

function renderQuiz(){
  var i = pick();
  if (i === null){ renderHome(); return; }
  var Q = POOL[i], body = $("b"); body.innerHTML = "";
  $("t").textContent = "السؤال " + (done.length + 1) + " من " + N;
  body.appendChild(el("p", "q", Q.q));
  var fb = el("div", "fb hide"); body.appendChild(fb);
  var opts = shuffle([[Q.a, 1]].concat(Q.w.map(function(x){ return [x, 0]; })));
  opts.forEach(function(o){
    var bt = el("button", "opt", o[0]);
    bt.onclick = function(){
      if (o[1]){
        var seen = done.some(function(k){ return POOL[k].f === Q.f; });
        done.push(i); cur = null; save();
        var d = DATA[Q.f];
        body.innerHTML = "";
        body.appendChild(el("div", "win", "✅ إجابة صحيحة! " + Q.e));
        lesson(body, d, !seen);
        var more = remaining().length;
        var nx = el("button", "next", more ? "السؤال التالي ←" : "إنهاء الاختبار 🎉");
        nx.onclick = function(){ if (more) renderQuiz(); else renderHome(); };
        body.appendChild(nx);
        document.body.className = d.bg || "calm"; $("deco").textContent = d.icon || "";
        window.scrollTo(0, 0);
      } else {
        bt.className = "opt bad"; bt.disabled = true;
        fb.textContent = "💡 ليس الأنسب. فكّر مرة أخرى."; fb.className = "fb";
      }
    };
    body.appendChild(bt);
  });
  home.className = "hide"; view.className = ""; document.body.className = "calm"; $("deco").textContent = "";
  window.scrollTo(0, 0);
}

$("start").onclick = renderQuiz;
$("back").onclick = renderHome;
$("reset").onclick = function(){ if (confirm("هل تريد إعادة الاختبار من البداية؟")){ done = []; cur = null; save(); renderHome(); } };
renderHome();
</script>
